name: Go tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GOWORK: off
  GOPRIVATE: github.com/transfer360/*,github.com/33100-io/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        # Private transfer360 modules need PAT_TOKEN. The authenticated Git
        # rewrite exists only for this step (trap) so build/test code can't
        # reuse it. Without the secret, a repo with private deps fails here.
        run: |
          if [ -n "${PAT_TOKEN}" ]; then
            cleanup() {
              git config --global --unset-all url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf || true
            }
            trap cleanup EXIT
            git config --global url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          go mod download
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 -race ./...
